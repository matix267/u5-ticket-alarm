name: U5-Tunneltour Ticket-Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ticket-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verfügbarkeit prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHECK_DURATION_SEC: "840"
          CHECK_INTERVAL_SEC: "30"
        run: python3 -u check_tickets.py
